<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La ruta secreta · Escalada en español</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap');

*{box-sizing:border-box}
:root{
  --ink:#101712; --lime:#dfff4f; --chalk:#f4f0e8;
  --red:#ff5d45; --blue:#5eb8ff; --purple:#a47aff;
  --yellow:#f2c53d; --green:#57d38c;
  --line:#354039; --card:#1b241e; --muted:#89958d;
}
body{margin:0;background:var(--ink);color:var(--chalk);font-family:Manrope,system-ui,sans-serif;min-height:100svh;overflow-x:hidden}
button{font:inherit}
.app{max-width:1080px;margin:auto;min-height:100svh;padding:20px clamp(16px,4vw,48px) 28px;display:flex;flex-direction:column}

header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.peak{width:38px;height:38px;background:var(--lime);color:var(--ink);display:grid;place-items:center;border-radius:11px;font-size:20px;transform:rotate(-3deg);text-decoration:none;transition:.2s;border:0;cursor:pointer}
.peak:hover,.peak:focus-visible{transform:rotate(0) scale(1.08);outline:2px solid var(--chalk);outline-offset:3px}
.brand{font-weight:800;font-size:clamp(1.15rem,3vw,1.45rem);letter-spacing:-.04em}
.voz{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--muted);border:1px solid var(--line);border-radius:100px;padding:5px 10px;cursor:default}
.voz.on{color:var(--lime);border-color:#4a5c2a}
.progress{margin-left:auto;display:flex;gap:7px}
.dot{width:26px;height:6px;border-radius:8px;background:var(--line);border:0;padding:0;cursor:pointer}
.dot.on{background:var(--lime)}

main{flex:1;display:grid;align-items:center;padding:24px 0}
.scene{display:grid;gap:22px;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.eyebrow{color:var(--lime);text-transform:uppercase;letter-spacing:.14em;font-weight:800;font-size:.75rem}
h1{font-size:clamp(2.2rem,7vw,5rem);line-height:.95;letter-spacing:-.07em;margin:4px 0 8px;max-width:800px}
.lead{font-size:clamp(1rem,2.5vw,1.2rem);color:#b9c2bb;max-width:620px;line-height:1.55;margin:0}

.dialog{background:var(--chalk);color:var(--ink);padding:18px 52px 18px 20px;border-radius:4px 22px 22px 22px;max-width:660px;font-size:1.08rem;line-height:1.5;box-shadow:0 14px 50px #0004;position:relative;display:flex;gap:14px;align-items:flex-start}
.dialog .who{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:#267d38;margin-bottom:6px}
.dialog .speak{position:absolute;right:10px;top:10px}
.dialog .said{flex:1;min-width:0}
.dialog .line{display:block}
.dialog.ok{box-shadow:0 14px 50px #0004,inset 5px 0 0 #1d8a4a}
.dialog.wrong{box-shadow:0 14px 50px #0004,inset 5px 0 0 #d8412c}
.dialog.wrong .who{color:#b3392a}
.dialog.flash{animation:said .3s ease both}
@keyframes said{from{opacity:.3;transform:translateY(-5px)}}
.avatar{flex:0 0 auto;width:56px;height:56px;border-radius:50%;overflow:hidden;display:block;box-shadow:0 0 0 2px #0002}
.avatar svg{width:100%;height:100%;display:block}

.question{font-size:1.15rem;font-weight:800;letter-spacing:-.02em;margin:0}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.choices[hidden]{display:none}
.choices.two{grid-template-columns:repeat(2,1fr)}
.choices.gear{grid-template-columns:repeat(4,1fr)}
.choice{border:1px solid var(--line);background:var(--card);color:var(--chalk);border-radius:22px;min-height:180px;padding:18px;cursor:pointer;text-align:left;transition:.2s;position:relative;overflow:hidden}
.choice:hover,.choice:focus-visible{transform:translateY(-4px);border-color:var(--lime);outline:none}
.choice:active{transform:scale(.98)}
.choice.selected{border-color:var(--lime);box-shadow:inset 0 0 0 2px var(--lime)}
.choice.wrong{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.choice strong{font-size:1.02rem;display:block;margin-top:10px;line-height:1.3}
.choice.text{display:flex;align-items:center;min-height:126px;padding-right:58px}
.choice.text strong{font-size:clamp(1.05rem,2.2vw,1.3rem);margin-top:0}
.art{font-size:clamp(3rem,8vw,5.6rem);display:block;text-align:center;line-height:1.15;filter:drop-shadow(0 10px 16px #0006)}
.art svg{width:100%;height:auto;max-height:190px;display:block;filter:none}
.art img{width:100%;height:190px;object-fit:cover;display:block;border-radius:10px}
.gear .choice{min-height:150px}
.gear .art svg{max-height:110px}
.speak{background:#ffffff18;border:0;color:#fff;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:17px;line-height:1;display:grid;place-items:center;transition:.2s}
.speak:hover{background:#ffffff33}
.choice .speak{position:absolute;right:12px;top:12px}

.stageart{border-radius:24px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(155deg,#26342c,#141b16)}
.stageart.clip{position:relative;border:0;background:none;box-shadow:0 10px 30px rgba(0,0,0,.35);cursor:pointer}
.stageart video{width:100%;height:auto;display:block;border-radius:24px}
.clipbtn{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:26px;cursor:pointer;backdrop-filter:blur(6px)}
.clipbtn[hidden]{display:none}
.stageart svg{width:100%;height:auto;display:block;max-height:320px}

.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.action{border:0;border-radius:14px;background:var(--lime);color:var(--ink);padding:15px 22px;font-weight:800;cursor:pointer;min-height:52px}
.action:hover{filter:brightness(1.08)}
.action:disabled{background:#3b453d;color:#8b978e;cursor:not-allowed}
.mic{border:1px solid var(--line);background:var(--card);color:var(--chalk);border-radius:14px;padding:15px 20px;font-weight:800;cursor:pointer;min-height:52px;display:inline-flex;align-items:center;gap:9px}
.mic:hover{border-color:var(--lime)}
.mic.live{background:var(--red);border-color:var(--red);color:#2a0d07;animation:pulse 1s infinite}
.mic:disabled{opacity:.45;cursor:not-allowed}
@keyframes pulse{50%{box-shadow:0 0 0 10px #ff5d4533}}
.restart{background:none;border:1px solid #526057;color:#fff;padding:13px 20px;border-radius:14px;cursor:pointer}

.heard{min-height:22px;font-size:.92rem;color:var(--muted)}
.heard:empty,.feedback:empty{display:none}
.heard b{color:var(--chalk);font-weight:700}
.feedback{min-height:8px;color:#ffb9aa;font-weight:700;line-height:1.45;max-width:660px}
.feedback.ok{color:var(--lime)}

.input{width:min(420px,100%);background:var(--card);border:1px solid var(--line);color:var(--chalk);border-radius:14px;padding:15px 18px;font:inherit;font-size:1.1rem}
.input:focus{outline:none;border-color:var(--lime)}

.vocab{border:1px solid var(--line);border-radius:16px;background:#151d18;max-width:660px}
.vocab summary{cursor:pointer;padding:12px 16px;font-weight:800;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);list-style:none}
.vocab summary::-webkit-details-marker{display:none}
.vocab summary::before{content:"▸ "}
.vocab[open] summary::before{content:"▾ "}
.vocab dl{margin:0;padding:0 16px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}
.vocab dt{font-weight:700;color:var(--chalk)}
.vocab dd{margin:0;color:var(--muted)}

.tiny{font-size:.78rem;color:var(--muted);margin-top:auto;padding-top:20px;text-align:center}
.tiny a{color:var(--muted)}

@media(max-width:700px){
  .app{padding-top:16px}
  .choices,.choices.gear{grid-template-columns:1fr 1fr}
  .choice{min-height:142px;padding:13px;border-radius:17px}
  /* 🔊 внизу справа: справа от текста на 320px не помещалось «descansar.» */
  .choice.text{min-height:110px;padding:13px 13px 54px;align-items:flex-start}
  .choice.text .speak{top:auto;bottom:9px;right:9px}
  .art{font-size:3.4rem}
  .choice strong{font-size:.9rem}
  .gear .choice{min-height:130px}
  main{padding:18px 0}
  .dialog{font-size:1rem;padding:15px 46px 15px 15px;gap:11px}
  .avatar{width:44px;height:44px}
  .progress{gap:5px}
  .progress .dot{width:11px}
  .vocab dl{grid-template-columns:1fr;gap:2px}
  .vocab dd{margin-bottom:8px}
}
</style>
<link rel="stylesheet" href="./css/quest-navigation.css">
</head>
<body>
<div class="app">
  <nav class="quest-nav" aria-label="Navegación de historias"><a href="./quests.html" data-quest-exit>← Todas las historias</a><span aria-current="page">La ruta secreta</span></nav>
  <header>
    <button class="peak" id="home" aria-label="Volver al inicio de esta historia" title="Volver al inicio de esta historia">⛰</button>
    <div class="brand">La ruta secreta</div>
    <span class="voz" id="voz" title="">voz: …</span>
    <div class="progress" id="progress" aria-label="Progreso"></div>
  </header>
  <main id="stage" aria-live="polite"></main>
  
  <div class="tiny" id="tiny">Toca 🔊 para escuchar · Habla para responder · Audio en español</div>
</div>
<script type="module" src="./js/rocodromo.js?v=3"></script>
<dialog class="leave-quest" id="leave-quest" aria-labelledby="leave-title" aria-describedby="leave-description">
  <h2 id="leave-title">¿Volver a las historias?</h2>
  <p id="leave-description">El progreso no se guarda. Si vuelves a entrar desde el catálogo, empezarás de nuevo.</p>
  <div class="leave-actions"><button type="button" data-stay autofocus>Seguir jugando</button><button type="button" data-leave>Salir al catálogo</button></div>
</dialog>
</body>
</html>
